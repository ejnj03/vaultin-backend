AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vault Auth - wallet authentication, user registration, and profile management

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256

Resources:
  VaultAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pinned so the physical name is predictable. Without this,
      # CloudFormation generates <stack>-<logical id>-<random>.
      FunctionName: vault-auth
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - arm64
      Policies:
        - Statement:
            - Sid: SecretsManagerAccess
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vault-auth-secrets-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vault-coinbase-auth-secrets-*
        - Statement:
            - Sid: DynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vault-users
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vault-users/index/address-index
        - Statement:
            - Sid: S3PresignedUrlAccess
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::vault-profile-images/profile-photos/*
      Events:
        GetNonce:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/nonce
            Method: GET
        PostVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/verify
            Method: POST
        PostUpdateAccess:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/update_access
            Method: POST
        PostLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/logout
            Method: POST
        PostRegisterUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/register/register-user
            Method: POST
        GetFindAddr:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/utils/find-addr/{username}
            Method: GET
        GetFindUsername:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/utils/find-username
            Method: GET
        PostCoinbaseSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /trade/coinbase/session-token
            Method: POST
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /profile/upload-url/{filetype}
            Method: GET
        PostUpdatePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /profile/update-photo
            Method: POST
        GetProfilePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /profile/my-profile-photo
            Method: GET
        GetValidateUsername:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/validate-username/{username}
            Method: GET
        GetLookupUserData:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /auth/utils/lookup-userData
            Method: GET

  VaultHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5180"
          - "https://vaultin.app"
          - "https://www.vaultin.app"
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true

Outputs:
  VaultApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${VaultHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  VaultAuthFunctionArn:
    Description: Vault Auth Lambda Function ARN
    Value: !GetAtt VaultAuthFunction.Arn
