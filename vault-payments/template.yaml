AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vault Payments API — friends, transactions, and payment requests

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256

Resources:
  VaultPaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Architectures:
        - arm64
      Policies:
        # DynamoDB — scoped to each table
        - DynamoDBCrudPolicy:
            TableName: vault-users
        - DynamoDBCrudPolicy:
            TableName: vault-payment-requests
        - DynamoDBCrudPolicy:
            TableName: vaultin-transactions
        - DynamoDBCrudPolicy:
            TableName: vault-friend-requests
        - DynamoDBCrudPolicy:
            TableName: vault-contacts
        # Secrets Manager — JWT secrets and Alchemy API key
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vault-auth-secrets-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vault-payments-secrets-*
      Events:
        # ---- User lookup ----
        GetUserByUsername:
          Type: HttpApi
          Properties:
            Path: /users/by-username/{username}
            Method: GET
            ApiId: !Ref VaultHttpApi
        GetUserByAddress:
          Type: HttpApi
          Properties:
            Path: /users/by-address/{address}
            Method: GET
            ApiId: !Ref VaultHttpApi

        # ---- Friends / Social ----
        SendFriendRequest:
          Type: HttpApi
          Properties:
            Path: /friends/send-friend-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        GetRecieved:
          Type: HttpApi
          Properties:
            Path: /friends/get-recieved
            Method: GET
            ApiId: !Ref VaultHttpApi
        GetSent:
          Type: HttpApi
          Properties:
            Path: /friends/get-sent
            Method: GET
            ApiId: !Ref VaultHttpApi
        AcceptFriendRequest:
          Type: HttpApi
          Properties:
            Path: /friends/accept-friend-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        RejectFriendRequest:
          Type: HttpApi
          Properties:
            Path: /friends/reject-friend-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        CancelFriendRequest:
          Type: HttpApi
          Properties:
            Path: /friends/friend-request/cancel
            Method: POST
            ApiId: !Ref VaultHttpApi
        GetUserFriends:
          Type: HttpApi
          Properties:
            Path: /friends/user-friends
            Method: GET
            ApiId: !Ref VaultHttpApi

        # ---- Transactions ----
        GetQuote:
          Type: HttpApi
          Properties:
            Path: /txns/get-quote
            Method: POST
            ApiId: !Ref VaultHttpApi
        LogTxn:
          Type: HttpApi
          Properties:
            Path: /txns/log-txn
            Method: POST
            ApiId: !Ref VaultHttpApi
        GetCompleted:
          Type: HttpApi
          Properties:
            Path: /txns/get-completed
            Method: GET
            ApiId: !Ref VaultHttpApi
        UpdateState:
          Type: HttpApi
          Properties:
            Path: /txns/update-state
            Method: POST
            ApiId: !Ref VaultHttpApi

        # ---- Payment Requests ----
        CreatePaymentRequest:
          Type: HttpApi
          Properties:
            Path: /payment-requests/create-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        SentRequests:
          Type: HttpApi
          Properties:
            Path: /payment-requests/sent
            Method: GET
            ApiId: !Ref VaultHttpApi
        ReceivedRequests:
          Type: HttpApi
          Properties:
            Path: /payment-requests/received
            Method: GET
            ApiId: !Ref VaultHttpApi
        RespondRequest:
          Type: HttpApi
          Properties:
            Path: /respond-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        CancelRequest:
          Type: HttpApi
          Properties:
            Path: /cancel-request
            Method: POST
            ApiId: !Ref VaultHttpApi
        CompletedRequest:
          Type: HttpApi
          Properties:
            Path: /completed-request
            Method: POST
            ApiId: !Ref VaultHttpApi

  VaultHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${VaultHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  VaultPaymentsFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt VaultPaymentsFunction.Arn

